name: Backend Load Testing using k6

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # hard cap — whole job must finish in 10 min

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js with npm cache ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ── 3. Install backend + exceljs (single npm ci, uses cache) ──────────
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # ── 4. Start backend in mock-DB mode ──────────────────────────────────
      - name: Start Backend (mock DB)
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: development
          MOCK_DB: "true"
        run: |
          npm start &
          npx wait-on http://localhost:5000/api/test --timeout 30000
          echo "✅ Backend ready"

      # ── 5. Seed test user ──────────────────────────────────────────────────
      - name: Seed k6 Test User
        run: |
          curl -sf -X POST http://localhost:5000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"k6 Bot","email":"k6.load@tournex.com","password":"k6pass123"}' \
            || true

      # ── 6. k6 via Grafana action (pre-built binary, NO apt-get) ───────────
      - name: Run k6 Load Test — 400 Iterations
        uses: grafana/k6-action@v0.3.1
        with:
          filename: backend/tests/load-test.js
          flags: --summary-export=backend/reports/k6-summary.json
        env:
          K6_NO_USAGE_REPORT: "true"
        continue-on-error: true   # still generate Excel even on threshold fail

      # ── 7. Ensure reports dir exists ───────────────────────────────────────
      - name: Prepare reports directory
        run: mkdir -p backend/reports

      # ── 8. Convert JSON → Excel ────────────────────────────────────────────
      - name: Generate Excel Report
        working-directory: backend
        run: |
          node tests/k6-to-excel.js \
            reports/k6-summary.json \
            reports/TourNex-LoadTest-Report.xlsx
          echo "📊 Excel report ready"

      # ── 9. Upload Excel artifact ───────────────────────────────────────────
      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournex-load-test-excel-report
          path: backend/reports/TourNex-LoadTest-Report.xlsx
          retention-days: 30

      # ── 10. Upload raw JSON (debug) ────────────────────────────────────────
      - name: Upload k6 JSON Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-json-summary
          path: backend/reports/k6-summary.json
          retention-days: 14

      # ── 11. Assert 400 iterations completed ────────────────────────────────
      - name: Assert 400 Test Cases Passed
        run: |
          ITERS=$(python3 -c "
          import json, sys
          d = json.load(open('backend/reports/k6-summary.json'))
          print(int(d.get('metrics',{}).get('iterations',{}).get('values',{}).get('count',0)))
          " 2>/dev/null || echo "0")
          echo "✅ Iterations completed: $ITERS"
          if [ "$ITERS" -lt 400 ]; then
            echo "❌ FAIL: Only $ITERS of 400 completed"
            exit 1
          fi
          echo "✅ PASS: All 400 test cases completed"
