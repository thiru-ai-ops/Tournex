name: Backend Load Testing using k6

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ── 3. Install dependencies (includes exceljs) ──────────────────────────
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # ── 4. Start backend ─────────────────────────────────────────────────────
      - name: Start Backend (mock DB)
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: development
          MOCK_DB: "true"
        run: |
          npm start &
          npx wait-on http://localhost:5000/api/test --timeout 30000
          echo "✅ Backend ready"

      # ── 5. Install k6 binary (single curl, ~20s) ─────────────────────────────
      - name: Install k6
        run: |
          K6_VERSION="v0.57.0"
          curl -sL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /tmp k6-${K6_VERSION}-linux-amd64/k6
          sudo mv /tmp/k6 /usr/local/bin/k6
          k6 version

      # ── 6. Create reports directory ──────────────────────────────────────────
      - name: Prepare reports directory
        run: mkdir -p backend/reports

      # ── 7. Seed test user ────────────────────────────────────────────────────
      - name: Seed k6 Test User
        run: |
          curl -sf -X POST http://localhost:5000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"k6 Bot","email":"k6.load@tournex.com","password":"k6pass123"}' \
            && echo "✅ User seeded" || echo "⚠️  Register returned non-2xx (user may exist)"

      # ── 8. Run k6 — 400 iterations ───────────────────────────────────────────
      - name: Run k6 Load Test — 400 Iterations
        run: |
          k6 run \
            --summary-export=backend/reports/k6-summary.json \
            --out json=backend/reports/k6-raw-lines.json \
            backend/tests/load-test.js
        continue-on-error: true   # generate Excel even if thresholds fail

      # ── 9. Generate Excel Report ─────────────────────────────────────────────
      - name: Generate Excel Report
        if: always()
        working-directory: backend
        run: |
          # Safety: create placeholder if k6 never wrote the summary
          if [ ! -f reports/k6-summary.json ]; then
            echo '{"metrics":{}}' > reports/k6-summary.json
            echo "⚠️  k6 summary missing — using empty placeholder"
          fi
          node tests/k6-to-excel.js \
            reports/k6-summary.json \
            reports/TourNex-LoadTest-Report.xlsx
          echo "📊 Excel report ready"

      # ── 10. Upload Excel artifact ────────────────────────────────────────────
      - name: Upload Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tournex-load-test-excel-report
          path: backend/reports/TourNex-LoadTest-Report.xlsx
          retention-days: 30

      # ── 11. Upload k6 JSON summary ───────────────────────────────────────────
      - name: Upload k6 JSON Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-json-summary
          path: backend/reports/k6-summary.json
          retention-days: 14

      # ── 12. Assert 400 iterations completed ──────────────────────────────────
      - name: Assert 400 Test Cases Completed
        run: |
          SUMMARY="backend/reports/k6-summary.json"

          ITERS=$(python3 - <<'EOF'
          import json, sys
          try:
              d = json.load(open("backend/reports/k6-summary.json"))
              m = d.get("metrics", {})
              iters = m.get("iterations", {}).get("values", {}).get("count", 0)
              print(int(iters))
          except Exception as e:
              print(0)
          EOF
          )

          echo "──────────────────────────────────────"
          echo "k6 Iterations completed : $ITERS"
          echo "Target                  : 400"
          echo "──────────────────────────────────────"

          if [ "$ITERS" -lt 400 ]; then
            echo "❌ FAIL: Only $ITERS / 400 iterations completed"
            exit 1
          else
            echo "✅ PASS: All $ITERS test cases completed successfully"
          fi
