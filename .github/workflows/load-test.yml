name: Backend Load Testing using k6

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Start Backend Express Server
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: development
          MOCK_DB: "true"
        run: |
          npm start &
          npx wait-on http://localhost:5000/api/test --timeout 60000

      - name: Run k6 Local Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: backend/tests/load-test.js
