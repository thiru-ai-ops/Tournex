name: Mobile Appium Automation Testing

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/appium-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/appium-tests.yml'

jobs:
  appium-test:
    runs-on: ubuntu-latest

    env:
      BACKEND_IP: "10.0.2.2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Start Backend Express Server
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: development
          MOCK_DB: "true"
        run: |
          npm start &
          npx wait-on http://localhost:5000/api/test --timeout 60000

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install

      - name: Expo Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Install Appium and Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --log appium.log &

      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd mobile/appium-tests
            npm install
            npm test

      - name: Upload Appium Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: appium.log

      - name: Upload Appium Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournex-mobile-report
          path: mobile/appium-tests/mochawesome-report/
