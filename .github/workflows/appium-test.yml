name: Complete Appium Automation Testing CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/appium-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/appium-test.yml'

jobs:
  appium-test:
    runs-on: ubuntu-latest

    env:
      BACKEND_IP: "10.0.2.2"

    steps:
      - name: Free Disk Space
        run: |
          echo "Disk space before cleaning:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleaning:"
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            mobile/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Start Backend Express Server
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: development
          MOCK_DB: "true"
        run: |
          npm start &
          npx wait-on http://localhost:5000/api/test --timeout 60000

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install

      - name: Regenerate Android Native Files
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: |
          echo "" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          ./gradlew assembleDebug --stacktrace

      - name: Install Appium and Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --log appium.log &

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            cd mobile/appium-java-tests
            mvn clean test

      - name: Generate Workflow Summary and Quality Gate
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const path = "mobile/appium-java-tests/target/surefire-reports/testng-results.xml";
          if (fs.existsSync(path)) {
            const content = fs.readFileSync(path, "utf8");
            
            // Extract counts using broad match
            const totalMatch = content.match(/total="(\d+)"/);
            const passedMatch = content.match(/passed="(\d+)"/);
            const failedMatch = content.match(/failed="(\d+)"/);
            const skippedMatch = content.match(/skipped="(\d+)"/);
            
            const total = totalMatch ? parseInt(totalMatch[1]) : 0;
            const passed = passedMatch ? parseInt(passedMatch[1]) : 0;
            const failed = failedMatch ? parseInt(failedMatch[1]) : 0;
            const skipped = skippedMatch ? parseInt(skippedMatch[1]) : 0;
            const pct = total > 0 ? ((passed / total) * 100).toFixed(2) : "0.00";
            
            let summary = "### :rocket: TourNex Appium Test Automation Summary\n\n";
            summary += "| Metric | Value |\n";
            summary += "| --- | --- |\n";
            summary += "| **Total Test Cases** | " + total + " |\n";
            summary += "| **Passed** | :white_check_mark: " + passed + " |\n";
            summary += "| **Failed** | :x: " + failed + " |\n";
            summary += "| **Skipped** | :warning: " + skipped + " |\n";
            summary += "| **Pass Percentage** | **" + pct + "%** |\n\n";
            
            if (failed > 0) {
              summary += "### :warning: Quality Gate Failures Detected!\n";
              summary += "Failed test cases details are available in the logs and downloadable Excel/HTML reports.\n";
            } else {
              summary += "### :white_check_mark: Quality Gate Passed successfully!\n";
            }
            
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            if (failed > 0) {
              process.exit(1);
            }
          } else {
            fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, "### :x: TestNG results not found!");
            process.exit(1);
          }
          '

      - name: Upload Excel Test Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Report
          path: mobile/appium-java-tests/reports/TestExecutionReport.xlsx
          retention-days: 30

      - name: Upload Extent HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-HTML-Report
          path: mobile/appium-java-tests/reports/ExtentReport.html
          retention-days: 30

      - name: Upload TestNG Output Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Output
          path: mobile/appium-java-tests/target/surefire-reports/
          retention-days: 30

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Failure-Screenshots
          path: mobile/appium-java-tests/screenshots/
          retention-days: 30

      - name: Upload Execution Log File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Log
          path: mobile/appium-java-tests/logs/
          retention-days: 30

      - name: Upload Appium Driver Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Driver-Log
          path: appium.log
          retention-days: 30
