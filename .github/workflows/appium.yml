name: Complete Appium Automation Testing CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/appium.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/appium.yml'
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            mobile/appium-tests/package-lock.json

      - name: Run npm install -g appium
        run: npm install -g appium

      - name: Start Appium Server
        run: |
          appium --log appium.log &
          # Wait for Appium to start
          timeout=30
          elapsed=0
          while ! curl -s http://127.0.0.1:4723/status > /dev/null && [ "$elapsed" -lt "$timeout" ]; do
            echo "Waiting for Appium server to start... ($elapsed/$timeout s)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          if ! curl -s http://127.0.0.1:4723/status > /dev/null; then
            echo "❌ ERROR: Appium server failed to start on port 4723"
            cat appium.log
            exit 1
          fi
          echo "✅ Appium server is up and running!"

      - name: Install Expo CLI (For Expo Go testing)
        run: npm install -g expo-cli

      - name: Run Tests without Emulator
        env:
          MOCK_DRIVER: "true"
        run: |
          chmod +x mobile/appium-tests/run-tests.sh
          ./mobile/appium-tests/run-tests.sh

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: mobile/appium-tests/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: |
            mobile/appium-tests/mochawesome-report/
            appium.log
          retention-days: 30
