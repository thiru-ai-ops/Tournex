name: Selenium E2E Automation Testing & Vulnerability Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'backend/**'
      - 'mobile/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  vulnerability-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Backend Dependencies
        working-directory: backend
        run: |
          echo "Auditing backend dependencies..."
          npm audit --audit-level=high

      - name: Audit Web Frontend Dependencies
        working-directory: web
        run: |
          echo "Auditing web dependencies..."
          npm audit --audit-level=high

      - name: Audit Mobile App Dependencies
        working-directory: mobile
        run: |
          echo "Auditing mobile dependencies..."
          npm audit --audit-level=high

  e2e-test:
    runs-on: ubuntu-latest
    needs: vulnerability-audit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Start Backend Express Server
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: development
          MOCK_DB: "true"
        run: |
          npm start &
          npx wait-on http://localhost:5000/api/test --timeout 60000

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Install Selenium Test Dependencies
        working-directory: web/selenium-tests
        run: npm ci || npm install

      - name: Build React App
        working-directory: web
        run: npm run build

      - name: Start Vite Preview Server
        working-directory: web
        run: |
          npm run preview -- --port 3000 &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Selenium Tests
        working-directory: web/selenium-tests
        env:
          HEADLESS: "true"
          TEST_URL: "http://localhost:3000"
        run: npm test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournex-e2e-report
          path: web/selenium-tests/mochawesome-report/
