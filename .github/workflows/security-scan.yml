name: Dependency Vulnerability Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'mobile/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Reporter Dependencies
        working-directory: web/selenium-tests
        run: npm ci || npm install

      - name: Generate Vulnerability Excel Report
        run: node web/selenium-tests/vulnerability-reporter.js

      - name: Upload Vulnerability Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournex-vulnerability-report
          path: web/selenium-tests/mochawesome-report/Vulnerability_Audit_Report.xlsx

      - name: Audit Backend Dependencies
        working-directory: backend
        run: |
          echo "Auditing backend dependencies..."
          npm audit --audit-level=high

      - name: Audit Web Frontend Dependencies
        working-directory: web
        run: |
          echo "Auditing web dependencies..."
          npm audit --audit-level=high

      - name: Audit Mobile App Dependencies
        working-directory: mobile
        run: |
          echo "Auditing mobile dependencies..."
          npm audit --audit-level=high
